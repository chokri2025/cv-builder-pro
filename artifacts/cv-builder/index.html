<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

    <!-- Google Search Console verification -->
    <meta name="google-site-verification" content="google10312dcad9f7918c" />

    <!-- Primary SEO -->
    <title>CV Builder Pro – Free Online Resume & CV Maker</title>
    <meta
      name="description"
      content="Create a professional CV or resume in minutes. Choose from 3 beautiful templates, add your experience, skills, education and download as PDF. Free, no sign-up required."
    />
    <meta
      name="keywords"
      content="CV builder, resume builder, free CV maker, online resume, CV template, resume template, PDF resume, professional CV, job application, curriculum vitae"
    />
    <meta name="author" content="CV Builder Pro" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.cvbuilder-pro.online/" />

    <!-- Open Graph (Facebook / LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.cvbuilder-pro.online/" />
    <meta property="og:title" content="CV Builder Pro – Free Online Resume & CV Maker" />
    <meta
      property="og:description"
      content="Create a polished, professional CV in minutes. Pick a template, fill in your details and download as PDF — completely free."
    />
    <meta property="og:image" content="https://www.cvbuilder-pro.online/opengraph.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:site_name" content="CV Builder Pro" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CV Builder Pro – Free Online Resume & CV Maker" />
    <meta
      name="twitter:description"
      content="Build a stunning CV in minutes. 3 templates, PDF download, no sign-up needed."
    />
    <meta name="twitter:image" content="https://www.cvbuilder-pro.online/opengraph.jpg" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "CV Builder Pro",
        "url": "https://www.cvbuilder-pro.online/",
        "description": "Free online CV and resume builder with professional templates and PDF export.",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Any",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "featureList": [
          "3 professional CV templates",
          "PDF download",
          "Print support",
          "Real-time preview",
          "Auto-save",
          "Photo upload"
        ]
      }
    </script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Merriweather:wght@300;400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
